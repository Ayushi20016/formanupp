<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>FORMANUPP • Digital Life Companion</title>
  <meta name="description" content="I am safe. I am offline. I am becoming. Digital detox, productivity, and self-care companion.">
  <meta name="theme-color" content="#0B0B0F">
  <link rel="manifest" href="./manifest.json">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: ['class', '[data-theme="dark"]'],
      theme: {
        extend: {
          colors: {
            brand: {
              purple: '#c084fc',
              pink: '#f472b6',
              mint: '#34d399',
              dark: '#0b0b0f',
              card: '#14141d'
            }
          }
        }
      }
    }
  </script>

  <!-- Canvas Confetti CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/styles.css">
</head>
<body class="bg-[#050508] text-gray-100 antialiased selection:bg-purple-500 selection:text-white">

  <!-- Outer Desktop Framing Wrapper -->
  <div id="phone-wrapper" class="phone-mockup-wrapper">
    <!-- Phone Mockup Container -->
    <div class="phone-mockup">
      <!-- Dynamic Island / Hardware Notch -->
      <div id="dynamic-island" class="dynamic-island" title="Reality Check">
        <div class="w-2.5 h-2.5 rounded-full bg-stone-700"></div>
        <div class="w-2 h-2 rounded-full bg-blue-900/60"></div>
      </div>

      <!-- Native Status Bar Simulation -->
      <div class="pt-3 px-7 flex justify-between items-center text-[11px] font-mono text-gray-400 select-none z-40">
        <span id="status-clock">9:41</span>
        <div class="flex items-center gap-1.5 text-xs">
          <span>5G</span>
          <svg class="w-3.5 h-3.5 inline" fill="currentColor" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.28 19.58 10.59 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9z"/></svg>
          <div class="w-5 h-2.5 border border-gray-400 rounded-sm p-0.5 flex items-center">
            <div class="w-full h-full bg-emerald-400 rounded-xs"></div>
          </div>
        </div>
      </div>

      <!-- App Header Bar -->
      <header class="px-5 py-2.5 flex items-center justify-between z-40 border-b border-white/5 bg-[#0b0b0f]/80 backdrop-blur-md">
        <div id="app-logo-btn" class="flex items-center gap-2 cursor-pointer group">
          <span class="text-xl">🕶️</span>
          <div>
            <h1 class="text-sm font-extrabold tracking-wider text-white font-mono leading-none group-hover:text-purple-300 transition-colors">
              FORMANUPP
            </h1>
            <span class="text-[9px] text-gray-400 font-mono tracking-widest uppercase">I am offline</span>
          </div>
        </div>

        <div class="flex items-center gap-2">
          <!-- Quick Reality Check Bell -->
          <button id="top-sig-btn" onclick="window.app && window.app.showToast('Screen Time Check', '...girl. Go live your life.', () => window.app.navigateTo('reset'))" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-xs text-purple-300 transition-all">
            ⚡
          </button>

          <!-- Menu Hamburger Drawer Button -->
          <button id="top-menu-btn" class="w-8 h-8 rounded-full bg-white/5 hover:bg-white/10 border border-white/10 flex items-center justify-center text-xs text-gray-300 transition-all">
            ☰
          </button>
        </div>
      </header>

      <!-- Toast Container (Top notifications simulator) -->
      <div id="toast-container" class="absolute top-16 left-0 right-0 z-50 flex flex-col items-center gap-2 px-4 pointer-events-none"></div>

      <!-- Scrollable Main Content Area -->
      <main id="screen-container" class="screen-scroll-container relative"></main>

      <!-- Bottom Navigation Dock -->
      <nav id="bottom-nav" class="absolute bottom-0 left-0 right-0 h-20 px-4 flex items-center justify-around z-40 bg-[#0e0e15]/90 backdrop-blur-xl border-t border-white/10">
        <button class="bottom-nav-btn flex flex-col items-center gap-1 text-purple-300 transition-all" data-screen="home">
          <span class="text-lg">🏠</span>
          <span class="text-[10px] font-bold font-mono">Home</span>
        </button>

        <button class="bottom-nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-all" data-screen="mind">
          <span class="text-lg">🧠</span>
          <span class="text-[10px] font-bold font-mono">Mind</span>
        </button>

        <button class="bottom-nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-all" data-screen="focus">
          <span class="text-lg">⏱️</span>
          <span class="text-[10px] font-bold font-mono">Focus</span>
        </button>

        <button class="bottom-nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-all" data-screen="reset">
          <span class="text-lg">✨</span>
          <span class="text-[10px] font-bold font-mono">Reset</span>
        </button>

        <button class="bottom-nav-btn flex flex-col items-center gap-1 text-gray-400 hover:text-white transition-all" data-screen="insights">
          <span class="text-lg">📊</span>
          <span class="text-[10px] font-bold font-mono">Insights</span>
        </button>
      </nav>

      <!-- Slide-Out Side Drawer Menu -->
      <div id="side-drawer" class="absolute inset-y-0 right-0 w-72 bg-[#12121c] border-l border-white/10 z-50 p-6 flex flex-col justify-between transform translate-x-full transition-transform duration-300 shadow-2xl">
        <div class="space-y-6">
          <div class="flex items-center justify-between border-b border-white/10 pb-4">
            <div class="flex items-center gap-2">
              <span class="text-2xl">🕶️</span>
              <div>
                <h3 class="text-sm font-extrabold text-white font-mono">FORMANUPP</h3>
                <p class="text-[10px] text-purple-400 font-mono">Navigation Hub</p>
              </div>
            </div>
            <button id="drawer-close-btn" class="text-gray-400 hover:text-white p-1 text-base">✕</button>
          </div>

          <div class="space-y-2">
            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="mystery">
              <span class="text-lg">🕶️</span>
              <span>Mystery Mode</span>
            </button>

            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="funeral">
              <span class="text-lg">🪦</span>
              <span>RIP: My Social Life</span>
            </button>

            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="recipes">
              <span class="text-lg">🍳</span>
              <span>Recipe Corner</span>
            </button>

            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="collections">
              <span class="text-lg">📷</span>
              <span>My Collections (Offline Me)</span>
            </button>

            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="achievements">
              <span class="text-lg">🏆</span>
              <span>Achievements & XP</span>
            </button>

            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="eye_break">
              <span class="text-lg">👁️</span>
              <span>Eye Break System</span>
            </button>

            <button class="drawer-item-btn w-full p-3 rounded-2xl bg-white/5 hover:bg-white/10 border border-white/5 text-left text-xs font-bold flex items-center gap-3 transition-all" data-screen="settings">
              <span class="text-lg">⚙️</span>
              <span>Settings & Privacy</span>
            </button>
          </div>
        </div>

        <div class="pt-4 border-t border-white/10 text-center">
          <p class="text-[11px] text-gray-400 italic">“Let your social media life die for a while. Let your real life come alive.”</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Live Clock Updater -->
  <script>
    function updateClock() {
      const el = document.getElementById('status-clock');
      if (el) {
        const now = new Date();
        el.textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
      }
    }
    setInterval(updateClock, 10000);
    updateClock();
  </script>

  <!-- Consolidated Application Bundle -->
  <script src="./js/bundle.js"></script>
</body>
</html>
